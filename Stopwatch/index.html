<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="canvas">
      <div class="timer">
        <span class="menit">00</span><span class="pembatas">:</span
        ><span class="detik">00</span><span class="pembatas">.</span
        ><span class="milidetik">00</span>
      </div>
      <div class="tombol-container">
        <button class="mulai" onclick="mulaiStopwatch()">Mulai</button>
        <button class="stop" onclick="stopStopwatch()">Stop</button>
        <button class="reset" onclick="resetStopwatch()">Reset</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
